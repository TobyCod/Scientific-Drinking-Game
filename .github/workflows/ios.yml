name: iOS TestFlight

# Baut die App auf einem gemieteten macOS-Rechner und laedt sie nach
# TestFlight. Fuer oeffentliche Repositories sind diese Runner kostenlos.
#
# Signiert wird manuell mit einem festen Apple-Distribution-Zertifikat und
# dem App-Store-Profil "Pegel App Store CI" (Release-Konfiguration im pbxproj).
# Frueher holte Xcode beides selbst (-allowProvisioningUpdates) und legte dabei
# je Lauf ein neues Development-Zertifikat an – bei zehn war Schluss.
# Beide laufen nach einem Jahr ab: dann neu anlegen und die drei Secrets ersetzen.
#
# Benoetigte Repository-Secrets:
#   ASC_KEY_P8     — Inhalt der .p8-Datei, base64-kodiert (nur fuer den Upload)
#   ASC_KEY_ID     — Key-ID des Schluessels
#   ASC_ISSUER_ID  — Issuer-ID des Teams
#   APPLE_TEAM_ID  — Team-ID (10 Zeichen)
#   IOS_DIST_P12, IOS_DIST_P12_PASSWORD — Distribution-Zertifikat mit Schluessel
#   IOS_APPSTORE_PROFILE — App-Store-Profil, base64-kodiert

# Bewusst nur von Hand ausloesbar: ein Upload verbraucht eine Build-Nummer
# und taucht sofort in App Store Connect auf.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Mac-Rechner (Intel, falls arm64 keinen Platz bekommt)
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-26-intel

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Apple verlangt seit dem 28.04.2026 Xcode 26 bzw. das iOS-26-SDK fuer
      # jede Einreichung. Gewaehlt wird die neueste stabile Version auf dem
      # Runner (Namen nur aus Ziffern und Punkten, also ohne Beta/RC) – ohne
      # Fremd-Action, weil dieser Job die Signierschluessel sieht.
      - name: Xcode waehlen
        run: |
          # Schleife bewusst NICHT in $( ): das bash 3.2 von macOS parst dort
          # Konstrukte anders als ein aktuelles bash.
          for app in /Applications/Xcode_*.app; do
            v=${app#/Applications/Xcode_}; v=${v%.app}
            [[ $v =~ ^[0-9.]+$ ]] && echo "$v"
          done | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 > "$RUNNER_TEMP/xcode-version"
          V=$(cat "$RUNNER_TEMP/xcode-version")
          sudo xcode-select -s "/Applications/Xcode_$V.app"
          xcodebuild -version
          xcodebuild -version | head -1 | grep -qE '^Xcode (2[6-9]|[3-9][0-9])' || { echo "Xcode 26 oder neuer noetig, gefunden: $V"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten
        run: npm ci

      # Dieselben Pruefungen wie im Web-Build. Ein Build, der die Tests nicht
      # besteht, hat in TestFlight nichts verloren.
      - name: Pruefen
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Web-Build fuer den Container
        run: npm run build:native

      - name: Assets in das iOS-Projekt kopieren
        run: npx cap sync ios

      - name: API-Schluessel ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      # Eigener Schluesselbund nur fuer diesen Lauf, nach GitHubs Anleitung
      # "Sign Xcode applications".
      - name: Zertifikat und Profil installieren
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -base64 24)
          echo "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_APPSTORE_PROFILE" | base64 --decode > "$RUNNER_TEMP/dist.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" > /dev/null
          security list-keychain -d user -s "$KC"
          security find-identity -v -p codesigning "$KC"
          # Xcode bis 15 und ab 16 suchen an verschiedenen Orten.
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/dist.mobileprovision" "$d/"
          done

      - name: Build-Nummer setzen
        working-directory: ios/App
        run: |
          # Jeder Upload braucht eine hoehere Build-Nummer als der vorige.
          # Die Lauf-Nummer waechst monoton und ist dafuer genau richtig.
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${{ github.run_number }}" App/Info.plist

      - name: Archivieren
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Signierart, Identitaet und Profil stehen im pbxproj am App-Target.
          # Hier NICHT setzen: Kommandozeilenwerte gelten fuer alle Targets.
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pegel.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Exportieren
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.pegel.party</key><string>Pegel App Store CI</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pegel.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist"

      - name: Nach TestFlight laden
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Lade $IPA"
          xcrun altool --upload-app -f "$IPA" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # Bei einem Fehlschlag ist der Xcode-Log die einzige brauchbare Spur.
      - name: Log sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            ~/Library/Logs/gym
            ~/Library/Developer/Xcode/DerivedData/**/Logs
          if-no-files-found: ignore
